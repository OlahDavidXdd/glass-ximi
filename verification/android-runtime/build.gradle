plugins { id 'java' }
java { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
def sdk = System.getenv('ANDROID_HOME') ?: System.getenv('ANDROID_SDK_ROOT')
if (!sdk) throw new GradleException('Set ANDROID_HOME to an SDK containing platforms/android-35/android.jar')
if (findProperty('verificationBuildDir')) layout.buildDirectory.set(file(findProperty('verificationBuildDir')))
def production = file('../../launcher-addon/app/src/main/java')
sourceSets.main.java {
    srcDirs = [production]
    include '**/NativeBackdropRequest.java', '**/ControllerUi.java', '**/ControllerStatus.java', '**/SupportReport.java', '**/SettingsActivity.java', '**/PreviewActivity.java', '**/LauncherRestart.java', '**/PagePillLayout.java', '**/ReturnSourceRefresh.java', '**/PageIndicatorGlass.java', '**/LiveGlassMotion.java', '**/SourceIconReturn.java', '**/SharedGlassMaterial.java', '**/MamlWidgetGlass.java', '**/MamlWidgetPolicy.java', '**/LiveIconBinding.java', '**/IconIntegrityWatcher.java', '**/AnimationArtwork.java', '**/OwnedTransitionDrawable.java', '**/LiquidGlassDrawable.java', '**/GlassSurface.java', '**/GlassBackdrop.java', '**/BackdropGeometry.java', '**/NativeScreenBackdrop.java', '**/SourceVisibility.java', '**/AnimationTargetResolver.java', '**/SearchGlassDrawable.java', '**/SearchBarBlur.java', '**/LauncherWidgets.java', '**/WidgetSurfacePolicy.java', '**/GlassProvider.java', '**/GlassConfig.java', '**/DebugLog.java', '**/DiagnosticLog.java', '**/HookVersion.java', '**/RestartHandshake.java', '**/AutoGlyph.java', '**/AutoIconPixels.java', '**/BuildConfig.java', '**/WallpaperBackdrop.java'
}
if (findProperty('ownedBaselineRoot')) {
    def original = new File(production, 'io/github/devarix/kashiglass/OwnedTransitionDrawable.java').canonicalFile
    sourceSets.main.java.exclude { entry -> entry.file.canonicalFile == original }
    sourceSets.main.java.srcDir file(findProperty('ownedBaselineRoot'))
}
if (findProperty('providerBaselineRoot')) {
    def original = new File(production, 'io/github/devarix/kashiglass/GlassProvider.java').canonicalFile
    sourceSets.main.java.exclude { entry -> entry.file.canonicalFile == original }
    sourceSets.main.java.srcDir file(findProperty('providerBaselineRoot'))
}
def generatedConfig = layout.buildDirectory.dir('generated-config')
sourceSets.main.java.srcDir generatedConfig
tasks.register('verificationBuildConfig') {
    inputs.file file('../../launcher-addon/app/build.gradle')
    outputs.dir generatedConfig
    doLast {
        def config = file('../../launcher-addon/app/build.gradle').text
        def code = (config =~ /versionCode (\d+)/)[0][1]
        def name = (config =~ /versionName '([^']+)'/)[0][1]
        def target = new File(generatedConfig.get().asFile, 'io/github/devarix/kashiglass/BuildConfig.java')
        target.parentFile.mkdirs()
        target.text = "package io.github.devarix.kashiglass; public final class BuildConfig { public static final int VERSION_CODE = ${code}; public static final String VERSION_NAME = \"${name}\"; }"
    }
}
tasks.named('compileJava') { dependsOn 'verificationBuildConfig' }
dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
    testRuntimeOnly 'de.robv.android.xposed:api:82'
    compileOnly files("${sdk}/platforms/android-35/android.jar")
    testImplementation files("${sdk}/platforms/android-35/android.jar")
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
// Java projects do not apply AGP's AAR transform; expose AndroidX's real classes.jar files.
def aarClasses = files(provider {
    configurations.testRuntimeClasspath.files.findAll { it.name.endsWith('.aar') }.collect {
        zipTree(it).matching { include 'classes.jar' }.singleFile
    }
})
test {
    classpath += aarClasses
    maxHeapSize = '1100m'
    maxParallelForks = 1
    systemProperty 'robolectric.dependency.repo.url', 'https://repo.maven.apache.org/maven2'
    systemProperty 'glass.results', file('results').absolutePath
    systemProperty 'glass.assets', file('../../launcher-addon/app/src/main/assets').absolutePath
    ['https.proxyHost','https.proxyPort','http.proxyHost','http.proxyPort','javax.net.ssl.trustStore','javax.net.ssl.trustStorePassword'].each { key ->
        if (System.getProperty(key)) systemProperty key, System.getProperty(key)
    }
    testLogging { events 'passed', 'failed', 'skipped'; exceptionFormat 'full' }
}
