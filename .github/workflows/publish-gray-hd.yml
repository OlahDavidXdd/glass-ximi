name: Publish Gray HD theme
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/publish-gray-hd.yml]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble verified theme and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat gray-hd-v3/Smoky_Glass_Solid_Gray_v3.mtz.part-* > Smoky_Glass_Solid_Gray_v3.mtz
          echo '36509b356ec5e5611bbdf2cfa2504d0b647523bed09bc571a40bed6d935481a9  Smoky_Glass_Solid_Gray_v3.mtz' | sha256sum --check
          if ! gh release view gray-hd-v3 >/dev/null 2>&1; then
            gh release create gray-hd-v3 --target main --title 'Smoky Glass Gray HD — devarix' --notes-file gray-hd-v3/release-notes.md --draft
          fi
          gh release upload gray-hd-v3 Smoky_Glass_Solid_Gray_v3.mtz Smoky_Glass_Solid_Gray_Preview.jpg Smoky_Glass_Gray_HD_Detail.jpg --clobber
          gh release edit gray-hd-v3 --draft=false --notes-file gray-hd-v3/release-notes.md
