plugins { id 'com.android.application' }
android {
    namespace 'io.github.devarix.kashiglass'
    compileSdk 35
    defaultConfig { applicationId 'io.github.devarix.kashiglass'; minSdk 33; targetSdk 35; versionCode 2; versionName '0.2.0-experimental' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    androidResources { noCompress += ['png'] }
    buildTypes { release { minifyEnabled false } }
}
dependencies { compileOnly 'de.robv.android.xposed:api:82'; testImplementation 'junit:junit:4.13.2' }
